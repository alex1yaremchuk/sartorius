<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Дамп с весов (Web Serial)</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 20px; }
  h1 { margin: 0 0 12px; font-size: 20px; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  legend { padding: 0 6px; color: #555; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  label { font-size: 14px; }
  select, input, button { padding: 6px 8px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
  button { background: #f8f8f8; cursor: pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status { font-size: 13px; color:#333; margin-top:6px }
  textarea { width: 100%; height: 280px; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #preview { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; border:1px solid #eee; border-radius:8px; padding:8px; height:160px; overflow:auto; background:#fafafa; }
  .muted { color:#666; font-size:12px; }
  .badge { display:inline-block; background:#eef; border:1px solid #cde; padding:2px 6px; border-radius:999px; font-size:12px; }
</style>
</head>
<body>
<h1>Сырой дамп с лабораторных весов (RS-232/USB-Serial)</h1>

<fieldset>
  <legend>Параметры соединения</legend>
  <div class="row">
    <button id="pick">Выбрать порт…</button>
    <span id="portName" class="muted">порт не выбран</span>
    <span id="rxBytes" class="badge">0 байт</span>
  </div>
  <div class="row">
    <label>Baud:
      <input id="baud" type="number" value="9600" min="300" step="300" style="width:100px">
    </label>
    <label>Data bits:
      <select id="dataBits">
        <option value="8" selected>8</option>
        <option value="7">7</option>
      </select>
    </label>
    <label>Parity:
      <select id="parity">
        <option value="none" selected>none</option>
        <option value="even">even</option>
        <option value="odd">odd</option>
      </select>
    </label>
    <label>Stop bits:
      <select id="stopBits">
        <option value="1" selected>1</option>
        <option value="2">2</option>
      </select>
    </label>
    <label>Flow:
      <select id="flow">
        <option value="none" selected>none</option>
        <option value="hardware">hardware (RTS/CTS)</option>
      </select>
    </label>
    <label>Делимитер (для предпросмотра):
      <select id="delimiter">
        <option value="auto" selected>auto (CR/LF)</option>
        <option value="\n">LF (\n)</option>
        <option value="\r">CR (\r)</option>
        <option value="\r\n">CRLF (\r\n)</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button id="connect" disabled>Подключить</button>
    <button id="disconnect" disabled>Отключить</button>
    <button id="clear">Очистить буфер</button>
  </div>
  <div id="status">Готово. Выберите порт и нажмите «Подключить».</div>
</fieldset>

<fieldset>
  <legend>Буфер (сырой поток — скопируйте и пришлите)</legend>
  <textarea id="raw" readonly></textarea>
</fieldset>

<fieldset>
  <legend>Предпросмотр по строкам (для удобства чтения)</legend>
  <div id="preview"></div>
</fieldset>

<script>
(() => {
  const els = {
    pick: document.getElementById('pick'),
    portName: document.getElementById('portName'),
    rxBytes: document.getElementById('rxBytes'),
    baud: document.getElementById('baud'),
    dataBits: document.getElementById('dataBits'),
    parity: document.getElementById('parity'),
    stopBits: document.getElementById('stopBits'),
    flow: document.getElementById('flow'),
    delimiter: document.getElementById('delimiter'),
    connect: document.getElementById('connect'),
    disconnect: document.getElementById('disconnect'),
    clear: document.getElementById('clear'),
    status: document.getElementById('status'),
    raw: document.getElementById('raw'),
    preview: document.getElementById('preview'),
  };

  let port = null;
  let reader = null;
  let connected = false;
  let rxCount = 0;
  let previewBuf = "";

  function setStatus(msg) { els.status.textContent = msg; }
  function setButtons() {
    els.connect.disabled = !port || connected;
    els.disconnect.disabled = !connected;
  }
  function updateRxBadge() { els.rxBytes.textContent = rxCount + " байт"; }
  function appendRaw(text) {
    els.raw.value += text;
    els.raw.scrollTop = els.raw.scrollHeight;
  }
  function updatePreview(addedText) {
    previewBuf += addedText;
    const delim = els.delimiter.value;
    let parts;
    if (delim === 'auto') {
      parts = previewBuf.split(/\r\n|\n|\r/);
    } else {
      const d = delim.replace('\\r','\r').replace('\\n','\n');
      parts = previewBuf.split(d);
    }
    previewBuf = parts.pop(); // хвост остаётся в буфере
    // выводим только последние ~2000 символов для компактности
    const shown = parts.slice(-200).join("\n");
    els.preview.textContent = shown;
    els.preview.scrollTop = els.preview.scrollHeight;
  }

  async function pickPort() {
    try {
      port = await navigator.serial.requestPort();
      const info = port.getInfo?.() || {};
      els.portName.textContent = `выбран (USB VID:${(info.usbVendorId||'—')}, PID:${(info.usbProductId||'—')})`;
      setStatus('Порт выбран. Установите параметры и нажмите «Подключить».');
      els.connect.disabled = false;
    } catch (e) {
      setStatus('Порт не выбран: ' + e.message);
    }
  }

  async function connect() {
    if (!port) return setStatus('Сначала выберите порт.');
    try {
      await port.open({
        baudRate: Number(els.baud.value || 9600),
        dataBits: Number(els.dataBits.value || 8),
        stopBits: Number(els.stopBits.value || 1),
        parity: els.parity.value || 'none',
        flowControl: (els.flow.value === 'hardware' ? 'hardware' : 'none'),
      });

      const decoder = new TextDecoderStream();
      port.readable.pipeTo(decoder.writable);
      reader = decoder.readable.getReader();

      connected = true;
      setButtons();
      setStatus('Соединено. Идёт приём…');
      rxCount = 0; updateRxBadge();
      previewBuf = "";

      while (connected) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) {
          rxCount += value.length;
          updateRxBadge();
          appendRaw(value);
          updatePreview(value);
        }
      }
    } catch (e) {
      setStatus('Ошибка соединения: ' + e.message);
      try { if (reader) await reader.releaseLock(); } catch {}
      try { if (port) await port.close(); } catch {}
      connected = false;
      setButtons();
    }
  }

  async function disconnect() {
    connected = false;
    try { if (reader) await reader.cancel(); } catch {}
    try { if (port) await port.close(); } catch {}
    setButtons();
    setStatus('Отключено.');
  }

  function clearBuffers() {
    els.raw.value = '';
    els.preview.textContent = '';
    previewBuf = '';
    rxCount = 0; updateRxBadge();
  }

  // Wire UI
  els.pick.addEventListener('click', pickPort);
  els.connect.addEventListener('click', connect);
  els.disconnect.addEventListener('click', disconnect);
  els.clear.addEventListener('click', clearBuffers);
  els.delimiter.addEventListener('change', () => updatePreview(''));

  // Feature detection
  if (!('serial' in navigator)) {
    setStatus('Браузер не поддерживает Web Serial API. Используйте Chrome/Edge/Brave/Opera по HTTPS или http://localhost.');
    els.pick.disabled = true;
    els.connect.disabled = true;
  } else {
    setStatus('Готово. Выберите порт, при необходимости скорректируйте параметры и нажмите «Подключить».');
  }
})();
</script>
</body>
</html>
