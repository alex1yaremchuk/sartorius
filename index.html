<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Весы Sartorius — Web Serial</title>
<style>
  body { font-family: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:#f4f6fb; color:#1f1f1f; margin:24px; }
  h1 { margin:0 0 20px; font-size:24px; font-weight:600; color:#1f2544; }
  .top-bar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  button,select,input{ font:inherit; border-radius:8px; border:1px solid #c6c9d2; background:#fff; padding:8px 14px; transition:.2s; }
  button{ cursor:pointer } button:hover:enabled{ background:#eef3ff; border-color:#a9b4f2 } button:disabled{ opacity:.5; cursor:not-allowed }
  .link-button{ background:transparent; border:none; color:#3366cc; padding:0 6px } .link-button:hover:enabled{ text-decoration:underline }
  .muted{ color:#5b6375; font-size:14px } .status{ font-size:14px; color:#1f3a6f; flex:1 1 auto; min-width:200px }
  .badge{ background:#eef0ff; border:1px solid #c8cff7; border-radius:999px; padding:2px 10px; font-size:13px; color:#2a3180 }
  .display{ background:linear-gradient(135deg,#1c2a40,#0d1726); color:#f5f9ff; border-radius:16px; padding:32px 24px; text-align:center; box-shadow:0 20px 45px rgba(16,26,48,.45); margin-bottom:24px; }
  .display-label{ font-size:16px; letter-spacing:.1em; text-transform:uppercase; opacity:.65; margin-bottom:12px }
  .display-row{ display:flex; align-items:flex-end; justify-content:center; gap:16px; flex-wrap:wrap }
  .display-value{ font-size:clamp(56px,10vw,120px); font-weight:700; line-height:1; letter-spacing:-.04em }
  .display-unit{ font-size:clamp(28px,5vw,46px); opacity:.85 }
  .display-info{ margin-top:18px; font-size:14px; opacity:.75 }
  .history{ background:#fff; border-radius:12px; padding:16px 20px; border:1px solid #e1e5ef; margin-bottom:28px }
  .history-title{ font-size:16px; font-weight:600; margin-bottom:12px; color:#1f2544 }
  .history-list{ list-style:none; margin:0; padding:0; max-height:220px; overflow:auto; font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  .history-list li{ padding:6px 0; border-bottom:1px solid #eef1fb } .history-list li:last-child{ border-bottom:none }
  details.panel{ background:#fff; border:1px solid #dbe1f2; border-radius:12px; padding:0 18px 18px }
  details.panel>summary{ cursor:pointer; font-weight:600; padding:16px 0; list-style:none; outline:none }
  details.panel[open]>summary{ border-bottom:1px solid #e6ebfa; margin-bottom:16px }
  .settings-grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-bottom:12px }
  .settings-grid label{ display:flex; flex-direction:column; gap:6px; font-size:14px; color:#3a3f52 }
  .panel-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px }
  textarea{ width:100%; min-height:180px; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; border:1px solid #d4d9e6; border-radius:8px; padding:10px; resize:vertical; background:#f9fbff; color:#28324e }
  @media (max-width:640px){ body{ margin:16px } .top-bar{ flex-direction:column; align-items:flex-start } .status{ min-width:auto } .display{ padding:24px 18px } }
</style>
</head>
<body>
<h1>Весы Sartorius — Web Serial</h1>

<div class="top-bar">
  <button id="pick" type="button">Выбрать COM-порт</button>
  <span id="portName" class="muted">Порт не выбран</span>
  <span id="status" class="status">Готов к подключению.</span>
  <span id="rxBytes" class="badge">0 байт</span>
  <button id="disconnect" class="link-button" type="button" disabled>Отключиться</button>
</div>

<section class="display" aria-live="polite">
  <div class="display-label">Последнее показание</div>
  <div class="display-row">
    <span id="displayValue" class="display-value">—</span>
    <span id="displayUnit" class="display-unit"></span>
  </div>
  <div id="displayInfo" class="display-info">Нет данных</div>
</section>

<section class="history">
  <div class="history-title">История показаний</div>
  <ul id="historyList" class="history-list"></ul>
</section>

<details class="panel">
  <summary>Настройки и отладка</summary>
  <div class="settings-grid">
    <label>Baud <input id="baud" type="number" value="2400" min="300" step="300" /></label>
    <label>Data bits
      <select id="dataBits"><option value="8">8</option><option value="7" selected>7</option></select>
    </label>
    <label>Parity
      <select id="parity"><option value="none">none</option><option value="even" selected>even</option><option value="odd">odd</option></select>
    </label>
    <label>Stop bits
      <select id="stopBits"><option value="1" selected>1</option><option value="2">2</option></select>
    </label>
    <label>Flow control
      <select id="flow"><option value="none" selected>none</option><option value="hardware">hardware (RTS/CTS)</option></select>
    </label>
    <label>Линии DTR/RTS
      <select id="signals"><option value="none">none</option><option value="dtr" selected>DTR only</option><option value="dtr_rts">DTR + RTS</option></select>
    </label>
    <label><span>Игнорировать BREAK</span><input id="ignoreBreak" type="checkbox" checked /></label>
    <label>Разделитель строк
      <select id="delimiter"><option value="auto" selected>auto (CR/LF)</option><option value="\n">LF (\n)</option><option value="\r">CR (\r)</option><option value="\r\n">CRLF (\r\n)</option></select>
    </label>
  </div>
  <div class="panel-actions">
    <button id="clear" type="button">Очистить буферы</button>
    <button id="sendPrint" type="button" disabled>Отправить PRINT</button>
  </div>
  <div class="debug-section">
    <label for="raw">Сырые данные</label>
    <textarea id="raw" readonly></textarea>
  </div>
</details>

<script>
(() => {
  const els = {
    pick: document.getElementById('pick'),
    portName: document.getElementById('portName'),
    status: document.getElementById('status'),
    rxBytes: document.getElementById('rxBytes'),
    disconnect: document.getElementById('disconnect'),
    baud: document.getElementById('baud'),
    dataBits: document.getElementById('dataBits'),
    parity: document.getElementById('parity'),
    stopBits: document.getElementById('stopBits'),
    flow: document.getElementById('flow'),
    signals: document.getElementById('signals'),
    ignoreBreak: document.getElementById('ignoreBreak'),
    delimiter: document.getElementById('delimiter'),
    clear: document.getElementById('clear'),
    sendPrint: document.getElementById('sendPrint'),
    raw: document.getElementById('raw'),
    displayValue: document.getElementById('displayValue'),
    displayUnit: document.getElementById('displayUnit'),
    displayInfo: document.getElementById('displayInfo'),
    historyList: document.getElementById('historyList')
  };

  const MAX_HISTORY = 25;
  const history = [];
  const timeFmt = new Intl.DateTimeFormat('ru-RU', {hour:'2-digit',minute:'2-digit',second:'2-digit'});

  let port=null, reader=null, decoder=null, readClosed=null;
  let connected=false, buffer='', rxCount=0;

  function setStatus(s){ els.status.textContent = s; }
  function setUi(){ els.pick.disabled = connected; els.disconnect.disabled = !connected; els.sendPrint.disabled = !connected; }
  function resetDisplay(){ els.displayValue.textContent='—'; els.displayUnit.textContent=''; els.displayInfo.textContent='Нет данных'; els.historyList.innerHTML=''; }
  function updateRx(n){ rxCount += n; els.rxBytes.textContent = `${rxCount.toLocaleString('ru-RU')} байт`; }
  function appendRaw(t){ els.raw.value += t; if (els.raw.value.length>20000) els.raw.value = els.raw.value.slice(-20000); els.raw.scrollTop = els.raw.scrollHeight; }

  function parseMeasurement(line){
    const m = line.trim().match(/^([+-]?)\s*([\d]+(?:[.,]\d+)?)(?:\s*([^\d\s]+))?/);
    if (!m) return { raw: line, display: line, numericValue: null, unit:'' };
    const sign = m[1] || '';
    const val = Number((sign + m[2]).replace(',','.'));
    const unit = m[3] || '';
    if (!Number.isFinite(val)) return { raw: line, display: line, numericValue:null, unit:'' };
    const dec = (m[2].includes('.')||m[2].includes(',')) ? (m[2].split(/[.,]/)[1].length) : 0;
    const fmt = val.toLocaleString('ru-RU',{minimumFractionDigits:dec, maximumFractionDigits:dec});
    return { raw: line, display: unit ? `${fmt} ${unit}` : fmt, numericValue: val, unit };
  }

  function handleLine(line){
    if (!line.trim()) return;
    const m = parseMeasurement(line);
    m.timestamp = new Date();
    history.push(m); if (history.length>MAX_HISTORY) history.shift();
    els.displayValue.textContent = m.numericValue==null ? m.display : m.display.replace(/\s*[a-zµ]+$/i,'');
    els.displayUnit.textContent = m.numericValue==null ? '' : (m.unit || '');
    els.displayInfo.textContent = `Получено ${timeFmt.format(m.timestamp)}`;
    renderHistory();
  }

  function renderHistory(){
    els.historyList.innerHTML='';
    for (const it of history.slice().reverse()){
      const li = document.createElement('li');
      li.textContent = `[${timeFmt.format(it.timestamp)}] ${it.display ?? it.raw}`;
      els.historyList.appendChild(li);
    }
  }

  function flushBuffer(){
    const delimVal = els.delimiter.value;
    const delim = (delimVal==='auto') ? null : delimVal.replace(/\\r/g,'\r').replace(/\\n/g,'\n');
    const parts = (delim ? buffer.split(delim) : buffer.split(/\r\n|\n|\r/));
    buffer = parts.pop();
    parts.forEach(handleLine);
  }

  async function applySignals(active){
    if (!port || typeof port.setSignals!=='function') return;
    const mode = els.signals.value;
    const sig = { dataTerminalReady:false, requestToSend:false };
    if (active){
      if (mode==='dtr') sig.dataTerminalReady = true;
      if (mode==='dtr_rts'){ sig.dataTerminalReady = true; sig.requestToSend = true; }
    }
    try{ await port.setSignals(sig); }catch(e){ console.warn('setSignals failed', e); }
  }

  function fmtInfo(info){
    const p=[]; if(info.usbVendorId)p.push(`VID:${info.usbVendorId.toString(16).padStart(4,'0').toUpperCase()}`);
    if(info.usbProductId)p.push(`PID:${info.usbProductId.toString(16).padStart(4,'0').toUpperCase()}`);
    return p.length?`USB ${p.join(', ')}`:'Порт выбран';
  }

  async function pickPort(){
    try{
      port = await navigator.serial.requestPort();
      els.portName.textContent = fmtInfo(port.getInfo?.()||{});
      setStatus('Порт выбран, соединяюсь…');
      setUi();
      // запускаем подключение без await, чтобы не «гасить» UI
      connect();
    }catch(e){
      setStatus('Порт не выбран: ' + (e?.message||e));
    }
  }

  async function connect(){
    if(!port) return;
    try{
      await port.open({
        baudRate:Number(els.baud.value||2400),
        dataBits:Number(els.dataBits.value||7),
        stopBits:Number(els.stopBits.value||1),
        parity:(els.parity.value||'even'),
        flowControl:(els.flow.value==='hardware'?'hardware':'none'),
      });
      await applySignals(true);

      decoder = new TextDecoderStream();
      readClosed = port.readable.pipeTo(decoder.writable).catch(()=>{});
      reader = decoder.readable.getReader();

      connected=true; buffer=''; rxCount=0; updateRx(0); resetDisplay(); setUi();
      setStatus('Подключено. Ждём данные… (нажмите PRINT или включите Auto/Continuous)');

      while (connected){
        try{
          const {value,done} = await reader.read();
          if (done) break;
          if (value){
            updateRx(value.length);
            appendRaw(value);
            buffer += value;
            flushBuffer();
          }
        }catch(err){
          const msg = String(err?.message||err).toLowerCase();
          if (els.ignoreBreak.checked && msg.includes('break')) continue;
          throw err;
        }
      }
      // сюда попадаем, если reader.read() вернул done
      if (connected) setStatus('Поток закрыт устройством.');
    }catch(e){
      setStatus('Ошибка подключения: ' + (e?.message||e));
      await forceClose();
    }
  }

  async function forceClose(){
    try{ if(reader){ await reader.cancel(); await reader.releaseLock(); } }catch{}
    reader=null;
    try{ if(decoder){ await readClosed; } }catch{} decoder=null; readClosed=null;
    await applySignals(false);
    try{ if(port){ await port.close(); } }catch{}
    connected=false; setUi();
  }

  async function disconnect(){
    if(!connected) return;
    setStatus('Отключаюсь…');
    await forceClose();
    port=null;
    els.portName.textContent='Порт не выбран';
    setStatus('Соединение разорвано.');
  }

  async function sendPrint(){
    if(!port || !port.writable) return;
    try{
      const w = port.writable.getWriter();
      await w.write(new TextEncoder().encode('P\r\n'));
      w.releaseLock();
      setStatus('Команда PRINT отправлена.');
    }catch(e){
      setStatus('Ошибка при отправке PRINT: ' + (e?.message||e));
    }
  }

  // UI
  els.pick.addEventListener('click', pickPort);
  els.disconnect.addEventListener('click', disconnect);
  els.clear.addEventListener('click', ()=>{ els.raw.value=''; buffer=''; rxCount=0; updateRx(0); });
  els.sendPrint.addEventListener('click', sendPrint);
  els.delimiter.addEventListener('change', flushBuffer);

  // Feature detect
  if(!('serial' in navigator)){
    setStatus('Браузер не поддерживает Web Serial. Используйте Chrome/Edge/Brave/Opera по HTTPS или http://localhost.');
    els.pick.disabled = true;
  }else{
    setStatus('Готов к подключению.');
    setUi(); resetDisplay();
  }
})();
</script>
</body>
</html>
